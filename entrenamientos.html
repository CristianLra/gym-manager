<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Historial de entrenamientos y progreso por ejercicio. Gym Manager registra cada set.">
    <title>Gym Manager — Historial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B0B0C">
    <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

    <meta property="og:title" content="Gym Manager — Tu rutina. Tus reglas.">
    <meta property="og:description" content="Diseña tus propias rutinas y registra cada set mientras entrenas.">
    <meta property="og:image" content="assets/images/og-image.png">
    <meta property="og:type" content="website">
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="wrap nav-inner">
            <div class="logo"><span class="dot"></span>GYM MANAGER</div>

            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html">Inicio</a>
                    <a href="index.html#rutina-dia">Hoy</a>
                    <a href="index.html#rutinas">Rutinas</a>
                    <a href="entrenamientos.html">Historial</a>
                </div>
                <div class="nav-cta">
                    <a href="#" id="userDisplay" class="user-badge"></a>
                    <a href="#" id="loginBtn" class="link-login">Iniciar sesión</a>
                    <a href="#" id="logoutBtn" class="link-login" style="display:none;">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <p id="perfilInfo" class="perfil-line perfil-page"></p>

        <!-- ===== GRÁFICAS ===== -->
        <section class="progreso-grid">

            <!-- SEGUIMIENTO DE PESO -->
            <div class="block-card">
                <h2>SEGUIMIENTO DE PESO</h2>

                <div class="peso-form">
                    <label class="sr-only" for="pesoInput">Peso (kg)</label>
                    <input type="number" id="pesoInput" placeholder="Peso (kg)" step="0.1" min="0" autocomplete="off">
                    <button id="pesoSubmit" class="btn btn-primary">GUARDAR</button>
                </div>

                <div class="chart-wrap">
                    <canvas id="pesoChart" height="120"></canvas>
                </div>

                <div class="peso-drop">
                    <button id="pesoListToggle" class="peso-toggle" type="button" aria-expanded="false">
                        <span>Historial de peso (<span class="count">0</span>)</span>
                        <span class="chevron" aria-hidden="true">▾</span>
                    </button>
                    <div id="pesoList" class="peso-list"></div>
                </div>
            </div>

            <!-- PROGRESO POR EJERCICIO -->
            <div class="block-card">
                <h2>PROGRESO POR EJERCICIO</h2>

                <div class="peso-form">
                    <label class="sr-only" for="ejercicioSelect">Ejercicio</label>
                    <select id="ejercicioSelect" class="select-dark">
                        <option value="">Selecciona un ejercicio</option>
                    </select>
                </div>

                <div class="chart-wrap">
                    <canvas id="progresoChart" height="120"></canvas>
                </div>
            </div>
        </section>

        <!-- ===== HISTORIAL DE ENTRENAMIENTOS ===== -->
        <section class="historial">
            <h2>HISTORIAL DE ENTRENAMIENTOS</h2>

            <div id="historialList" class="historial-list"></div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="wrap">
            <div class="logo"><span class="dot"></span>GYM MANAGER</div>
            <p class="copy">© 2026 GYM MANAGER — CRISTIAN</p>
        </div>
    </footer>

    <!-- ===== MODAL CONFIRMACIÓN ===== -->
    <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-content confirm-box">
            <h2 id="confirmTitle">¿Confirmar?</h2>
            <p id="confirmMessage" class="subtitle"></p>
            <div class="confirm-actions">
                <button id="confirmOk" class="btn btn-primary">Sí</button>
                <button id="confirmCancel" class="btn btn-ghost">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ===== TOASTS ===== -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/ui.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script-entrenamientos.js"></script>
</body>

</html>
